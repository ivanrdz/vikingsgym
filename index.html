<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memorama Vikings Corp.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* Colores del logo Vikings Corp: rojo, negro y blanco */
  --p950:#030303; --p900:#0b0b0b; --p800:#161616; --p700:#3a0a0c; --p600:#8f0f14; --p500:#c4161c; --p300:#f2b8ba; --p100:#f4f4f4;
  --gold:#e31e24; --gold2:#b3131a; --gold3:#ffffff; --white:#ffffff; --red:#ff2d35;
  --display: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--body); color:var(--white);
  background:radial-gradient(ellipse at 50% 40%, #5a0c10 0%, var(--p800) 50%, var(--p950) 100%);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}

/* ===== Fondo de casino: rayos girando ===== */
.rays{position:fixed;inset:-50%;z-index:0;pointer-events:none;opacity:.08;
  background:repeating-conic-gradient(from 0deg, var(--p300) 0deg 6deg, transparent 6deg 18deg);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Marco de focos tipo marquesina ===== */
.frame{position:fixed;inset:clamp(4px,1vmin,12px);border:clamp(2px,.4vmin,5px) solid var(--gold2);
  border-radius:clamp(12px,2vmin,28px);pointer-events:none;z-index:5;
  box-shadow:0 0 18px rgba(227,30,36,.45), inset 0 0 18px rgba(227,30,36,.25)}
.bulb{position:absolute;width:clamp(6px,1vmin,14px);height:clamp(6px,1vmin,14px);border-radius:50%;
  transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 8px 3px var(--gold);
  animation:blink 1s steps(1) infinite}
.bulb.b{animation-delay:.5s}
@keyframes blink{0%{opacity:1}50%{opacity:.18;box-shadow:none}}
body.fast .bulb{animation-duration:.25s}

/* ===== Pantallas ===== */
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(18px,4vmin,56px);gap:clamp(10px,2.4vmin,32px)}
.screen.active{display:flex;animation:enter .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

.title{font-family:var(--display);text-align:center;line-height:.95;letter-spacing:.02em;
  font-size:clamp(34px,8.5vmin,120px);
  background:linear-gradient(180deg,#fff 0%,#fff 48%,#d9d9d9 52%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 var(--gold)) drop-shadow(0 7px 0 #000) drop-shadow(0 0 26px rgba(227,30,36,.7))}
.title small{display:block;font-size:.38em;letter-spacing:.3em;margin-bottom:.15em}
.sub{font-size:clamp(16px,3vmin,40px);color:var(--p100);text-align:center;font-weight:700}

.btn{font-family:var(--display);font-size:clamp(22px,4.6vmin,64px);color:#fff;
  padding:.45em 1.6em;border:none;border-radius:999px;cursor:pointer;letter-spacing:.06em;
  background:linear-gradient(180deg,#ff4a50,var(--gold) 50%,var(--gold2));border:3px solid #fff;
  box-shadow:0 .14em 0 #5c070a, 0 0 30px rgba(227,30,36,.6);
  transition:transform .1s}
.btn:active{transform:translateY(.1em) scale(.97);box-shadow:0 .04em 0 #5c070a}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 .14em 0 #5c070a,0 0 60px rgba(227,30,36,.95)}}
.btn.ghost{background:transparent;color:var(--white);border:3px solid var(--p300);box-shadow:none;font-size:clamp(16px,3vmin,36px)}

/* ===== Cartas ===== */
.card{perspective:1200px;cursor:pointer;aspect-ratio:3/4}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12%/9%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.down{background:
    radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,.18) 31%, transparent 32%),
    repeating-linear-gradient(45deg, rgba(227,30,36,.22) 0 8%, transparent 8% 16%),
    linear-gradient(160deg,#2a2a2a,#111 55%,#000);
  border:clamp(3px,.5vmin,7px) solid var(--gold2);
  box-shadow:inset 0 0 0 clamp(3px,.6vmin,8px) var(--p800), 0 6px 18px rgba(0,0,0,.45)}
.down .v{width:52%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,#ff3a40,var(--gold2));border:3px solid #fff;
  font-family:var(--display);color:var(--white);font-size:calc(var(--cw,120px)*.26);line-height:1;
  text-shadow:0 3px 0 #000}
.down .v span{font-size:.2em;letter-spacing:.1em;color:#fff;margin-top:.15em}
.up{transform:rotateY(180deg);background:radial-gradient(circle at 50% 35%,#fff,#ececec);
  border:clamp(3px,.5vmin,7px) solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.up svg{width:78%;height:78%}
.up img{width:94%;height:88%;object-fit:contain}
.up::after{content:"";position:absolute;inset:-50%;opacity:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%)}
.card.flip .up::after{animation:shine .7s .15s ease-out}
@keyframes shine{0%{opacity:1;transform:translateX(-60%)}100%{opacity:0;transform:translateX(60%)}}

.card.ok .inner{animation:bounce .6s cubic-bezier(.3,1.8,.5,1)}
.card.ok .up{border-color:#fff;animation:glow 1.4s ease-in-out infinite}
@keyframes bounce{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes glow{50%{box-shadow:0 0 calc(var(--cw,120px)*.25) calc(var(--cw,120px)*.04) var(--gold)}}
.card.bad .inner{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-6%)}75%{transform:rotateY(180deg) translateX(6%)}}

/* ===== Inicio ===== */
#demo{display:grid;grid-template-columns:repeat(6,clamp(60px,12vmin,170px));gap:clamp(8px,1.6vmin,22px);--cw:clamp(60px,12vmin,170px)}
#demo .card{cursor:default}
#demo .card:nth-child(odd){animation:float 3s ease-in-out infinite}
#demo .card:nth-child(even){animation:float 3s 1.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8%)}}
.mini-rank{font-size:clamp(14px,2.2vmin,28px);color:var(--p100);text-align:center}
.mini-rank b{color:var(--gold)}
@media (orientation:portrait){ #demo{grid-template-columns:repeat(3,clamp(70px,18vmin,200px));--cw:clamp(70px,18vmin,200px)} }

/* ===== Nombre + teclado en pantalla ===== */
.namebox{font-family:var(--display);font-size:clamp(26px,5.5vmin,72px);min-width:min(80vw,14ch);text-align:center;
  padding:.25em .6em;border-radius:.3em;background:rgba(0,0,0,.35);border:3px solid var(--gold);
  color:var(--white);min-height:1.6em;letter-spacing:.06em}
.namebox .caret{display:inline-block;width:.08em;height:1em;background:var(--gold);vertical-align:-.1em;margin-left:.05em;animation:blink .9s steps(1) infinite}
.namebox .ph{color:var(--p300);opacity:.6}
.kb{display:flex;flex-direction:column;gap:clamp(5px,1vmin,12px);width:min(90vw,1000px)}
.kb .row{display:flex;justify-content:center;gap:clamp(4px,.8vmin,10px)}
.key{flex:1;max-width:clamp(30px,8.5vmin,96px);aspect-ratio:1/1.05;border:none;border-radius:.3em;cursor:pointer;
  font-family:var(--display);font-size:clamp(14px,3.2vmin,38px);color:#111;
  background:linear-gradient(180deg,#fff,#e6e6e6);box-shadow:0 .15em 0 #999}
.key:active{transform:translateY(.1em);box-shadow:none;background:var(--p300)}
.key.wide{max-width:clamp(140px,40vmin,480px);flex:4;aspect-ratio:auto;padding:.5em 0}
.key.mid{max-width:clamp(60px,15vmin,170px);flex:2;aspect-ratio:auto;background:linear-gradient(180deg,#444,#1a1a1a);color:#fff;box-shadow:0 .15em 0 #000}
.key.go{max-width:clamp(80px,22vmin,260px);flex:3;aspect-ratio:auto;color:#fff;background:linear-gradient(180deg,#ff4a50,var(--gold2));box-shadow:0 .15em 0 #5c070a}

/* ===== Juego ===== */
#sGame{justify-content:flex-start;padding-top:clamp(20px,3vmin,40px)}
.hud{width:min(100%,1600px);display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--display);font-size:clamp(16px,3.4vmin,46px)}
.chip{display:flex;align-items:center;gap:.35em;padding:.2em .7em;border-radius:999px;background:rgba(0,0,0,.35);border:2px solid var(--p500)}
.chip b{color:var(--gold)}
.chip.hot{border-color:var(--red);animation:hot .5s ease-in-out infinite alternate}
.chip.hot b{color:#fff}
.chip{border-color:var(--gold)}
@keyframes hot{to{background:rgba(244,63,94,.55);transform:scale(1.08)}}
.pname{color:var(--p100);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}
.exit{font-size:.7em;width:2em;height:2em;border-radius:50%;border:2px solid var(--p300);background:transparent;color:var(--p100);cursor:pointer;font-family:var(--body);font-weight:900}
.bar{width:min(100%,1600px);height:clamp(8px,1.4vmin,18px);border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--p600)}
.bar i{display:block;height:100%;width:100%;border-radius:99px;transform-origin:left;
  background:linear-gradient(90deg,var(--gold2),#ff5a60);transition:transform 1s linear, background .3s}
.bar.hot i{background:#fff;animation:barblink .5s steps(1) infinite}
@keyframes barblink{50%{background:var(--red)}}
.boardwrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid}

/* ===== Resultados ===== */
#msg{font-family:var(--display);font-size:clamp(24px,5.5vmin,74px);text-align:center;color:#fff;
  text-shadow:0 0 18px rgba(227,30,36,.7), 0 4px 0 var(--p900)}
.slot{display:flex;gap:clamp(4px,.8vmin,10px);padding:clamp(8px,1.4vmin,18px);border-radius:.4em;
  background:linear-gradient(180deg,#ff4a50,var(--gold2));border:3px solid #fff;box-shadow:0 0 40px rgba(227,30,36,.6)}
.slot .d{font-family:var(--display);font-size:clamp(40px,10vmin,140px);width:.8em;text-align:center;line-height:1.15;
  background:linear-gradient(180deg,#000 0%,var(--p900) 20%,var(--p800) 50%,var(--p900) 80%,#000 100%);color:#fff;border-radius:.12em;
  text-shadow:0 0 14px var(--gold)}
.slot .lbl{align-self:center;font-family:var(--display);color:#fff;font-size:clamp(14px,2.6vmin,34px);padding:0 .3em}
.rank{width:min(94vw,820px);border-collapse:separate;border-spacing:0 clamp(3px,.6vmin,8px);font-size:clamp(15px,2.8vmin,36px)}
.rank td{padding:.25em .6em;background:rgba(0,0,0,.3)}
.rank td:first-child{border-radius:.4em 0 0 .4em;width:2.6em;text-align:center;font-family:var(--display);color:#ff5a60}
.rank td:last-child{border-radius:0 .4em .4em 0;text-align:right;font-family:var(--display)}
.rank tr.me td{background:var(--gold);color:#fff;animation:pop .6s .4s both}
.rank tr.me td:first-child{color:#fff}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.rank-title{font-family:var(--display);font-size:clamp(16px,3vmin,38px);letter-spacing:.2em;color:var(--p100)}
.row-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ===== Efectos ===== */
.spark{position:fixed;width:clamp(6px,1.1vmin,14px);height:clamp(6px,1.1vmin,14px);border-radius:50%;z-index:20;pointer-events:none;
  background:#fff;box-shadow:0 0 10px 3px var(--gold);animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.drop{position:fixed;top:-8vh;z-index:20;pointer-events:none;animation:fall linear forwards}
.drop.coin{width:clamp(18px,3.4vmin,46px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--gold) 0 38%,#fff 39% 44%,var(--gold) 45% 100%);
  border:.16em dashed #fff;box-shadow:0 0 0 2px var(--gold2)}
.drop.conf{width:clamp(8px,1.4vmin,18px);height:clamp(14px,2.4vmin,30px);border-radius:2px}
@keyframes fall{to{transform:translateY(118vh) rotate(var(--r,720deg)) rotateY(720deg)}}
.flash{position:fixed;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(227,30,36,.35) 50%,transparent 75%);animation:flash .8s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.toast{position:fixed;left:50%;top:50%;z-index:25;pointer-events:none;font-family:var(--display);
  font-size:clamp(30px,8vmin,110px);color:#fff;text-shadow:0 0 24px var(--gold),0 5px 0 var(--gold2),0 8px 0 #000;
  animation:toast 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}

@media (prefers-reduced-motion:reduce){.rays{animation:none}}
</style>
</head>
<body>
<div class="rays"></div>
<div class="frame" id="frame"></div>

<!-- 1. INICIO -->
<section class="screen active" id="sStart">
  <h1 class="title"><small>MEMORAMA</small>VIKINGS CORP.</h1>
  <div id="demo"></div>
  <button class="btn pulse" id="bPlay">¡JUGAR!</button>
  <p class="sub" id="subtitle">Encuentra los 12 pares antes de que se acabe el tiempo</p>
  <div class="mini-rank" id="miniRank"></div>
</section>

<!-- 2. NOMBRE -->
<section class="screen" id="sName">
  <h2 class="title" style="font-size:clamp(26px,6vmin,80px)">¿CÓMO TE LLAMAS, VIKINGO?</h2>
  <div class="namebox" id="nameBox"></div>
  <div class="kb" id="kb"></div>
</section>

<!-- 3. JUEGO -->
<section class="screen" id="sGame">
  <div class="hud">
    <div class="chip">⏱ <b id="time">45</b></div>
    <div class="pname" id="pName"></div>
    <div class="chip">PARES <b id="pairs">0</b>/<span id="total">12</span></div>
    <button class="exit" id="bExit" aria-label="Salir">✕</button>
  </div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div class="boardwrap" id="boardWrap"><div id="board"></div></div>
</section>

<!-- 4. RESULTADOS -->
<section class="screen" id="sEnd">
  <div id="msg"></div>
  <div class="slot" id="slot"></div>
  <div class="rank-title">🏆 TABLA DE CAMPEONES</div>
  <table class="rank" id="rank"></table>
  <div class="row-btns">
    <button class="btn pulse" id="bAgain">JUGAR OTRA VEZ</button>
  </div>
</section>

    <path d="M34 94 H45 M34 101 H45 M34 108 H45" stroke="#fff" stroke-width="2.5"/>
    <path d="M45 22 H62 C70 22 74 16 80 12 C98 22 110 42 110 64 C110 78 104 90 96 98 C92 82 80 70 62 66 H45 Z" fill="${P}"/>
    <path d="M80 12 C98 22 110 42 110 64 C110 78 104 90 96 98" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <circle cx="54" cy="44" r="4" fill="${PD}"/></svg>`,
  escudo: `<svg viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="50" fill="${PD}"/><circle cx="60" cy="60" r="43" fill="${P}"/>
    <path d="M60 17 A43 43 0 0 1 103 60 L60 60 Z M60 103 A43 43 0 0 1 17 60 L60 60 Z" fill="#fff"/>
    <circle cx="60" cy="60" r="13" fill="#888" stroke="${PD}" stroke-width="5"/>
    <g fill="${PD}"><circle cx="60" cy="13" r="3"/><circle cx="107" cy="60" r="3"/><circle cx="60" cy="107" r="3"/><circle cx="13" cy="60" r="3"/></g></svg>`,
  disco: `<svg viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="50" fill="${PD}"/><circle cx="60" cy="60" r="40" fill="${P}"/>
    <circle cx="60" cy="60" r="27" fill="none" stroke="${P2}" stroke-width="4"/>
    <circle cx="60" cy="60" r="10" fill="#fff" stroke="${PD}" stroke-width="4"/>
    <text x="60" y="36" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="13" fill="#fff">20</text>
    <text x="60" y="94" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="11" fill="#fff">KG</text></svg>`,
  cuerda: `<svg viewBox="0 0 120 120">
    <path d="M30 42 C14 120 106 120 90 42" fill="none" stroke="${P}" stroke-width="6" stroke-linecap="round"/>
    <rect x="22" y="10" width="16" height="36" rx="7" fill="${PD}"/><rect x="82" y="10" width="16" height="36" rx="7" fill="${PD}"/>
    <rect x="22" y="20" width="16" height="4" fill="${P}"/><rect x="82" y="20" width="16" height="4" fill="${P}"/></svg>`,
  trofeo: `<svg viewBox="0 0 120 120">
    <path d="M38 26 H22 C22 48 30 56 42 56 M82 26 H98 C98 48 90 56 78 56" fill="none" stroke="${P}" stroke-width="7" stroke-linecap="round"/>
    <path d="M36 16 H84 V44 A24 24 0 0 1 36 44 Z" fill="${P}"/>
    <path d="M60 24 L64 34 L75 34 L66 41 L69 52 L60 45 L51 52 L54 41 L45 34 L56 34 Z" fill="#fff"/>
    <rect x="54" y="66" width="12" height="16" fill="${PD}"/>
    <rect x="40" y="80" width="40" height="10" rx="2" fill="${PD}"/><rect x="32" y="90" width="56" height="14" rx="3" fill="${PD}"/></svg>`,
  pesarusa: `<svg viewBox="0 0 120 120">
    <path d="M38 54 V38 A22 22 0 0 1 82 38 V54" fill="none" stroke="${PD}" stroke-width="11" stroke-linecap="round"/>
    <circle cx="60" cy="76" r="33" fill="${P}"/>
    <rect x="38" y="102" width="44" height="9" rx="3" fill="${PD}"/>
    <text x="60" y="86" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="26" fill="#fff">16</text>
    <text x="60" y="98" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="9" fill="#fff">KG</text></svg>`
};
// Orden de prioridad: se usan las primeras CONFIG.pares imágenes
const ORDEN = ['vcorp','vsport','mancuerna','preentreno','cerro','pesarusa','hacha','trofeo','shaker','escudo','disco','cuerda'];
const KEYS = ORDEN.slice(0, Math.max(4, Math.min(12, CONFIG.pares)));

// =====================================================================
//  SONIDOS (Web Audio API, sin archivos)
// =====================================================================
let ac;
function audio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function tone(f, d=.12, type='square', delay=0, vol=.12, slideTo){
  if(!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  key:   () => tone(900, .04, 'square', 0, .06),
  flip:  () => tone(500, .09, 'triangle', 0, .15, 1100),
  ok:    () => [660, 880, 1320].forEach((f,i) => tone(f, .14, 'square', i*.07, .1)),
  bad:   () => tone(220, .25, 'sawtooth', 0, .07, 110),
  tick:  () => tone(1200, .05, 'sine', 0, .1),
  start: () => [392, 523, 659, 784].forEach((f,i) => tone(f, .16, 'square', i*.09, .1)),
  win:   () => [523,659,784,1047,0,784,1047,1319].forEach((f,i) => f && tone(f, .22, 'square', i*.12, .1)),
  lose:  () => [392, 330, 262, 196].forEach((f,i) => tone(f, .3, 'triangle', i*.22, .14)),
  coin:  () => { tone(1568, .05, 'square', 0, .05); tone(2093, .08, 'square', .05, .05); }
};

// =====================================================================
//  UTILIDADES
// =====================================================================
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); if(id==='sGame') layout(); }
function cardHTML(key){
  return `<div class="inner"><div class="face down"><div class="v">V<span>VIKINGS</span></div></div><div class="face up">${ICONS[key]}</div></div>`;
}
document.addEventListener('contextmenu', e => e.preventDefault());

// =====================================================================
//  FOCOS DE MARQUESINA
// =====================================================================
function buildBulbs(){
  const f = $('frame'); f.innerHTML = '';
  const w = f.clientWidth, h = f.clientHeight, step = Math.max(28, Math.min(w,h) / 18);
  const pts = [];
  for(let x = step/2; x < w; x += step){ pts.push([x,0]); pts.push([x,h]); }
  for(let y = step/2; y < h; y += step){ pts.push([0,y]); pts.push([w,y]); }
  pts.forEach((p,i) => { const b = document.createElement('i'); b.className = 'bulb' + (i % 4 < 2 ? '' : ' b');
    b.style.left = p[0] + 'px'; b.style.top = p[1] + 'px'; f.appendChild(b); });
}

// =====================================================================
//  ACOMODO RESPONSIVO DEL TABLERO
// =====================================================================
function layout(){
  const wrap = $('boardWrap'), board = $('board');
  const W = wrap.clientWidth, H = wrap.clientHeight; if(!W || !H) return;
  const n = board.children.length || KEYS.length * 2;
  const gap = Math.max(8, Math.min(W, H) * .025);
  let cols = 1, cw = 0;
  for(let c = 2; c <= n; c++){
    if(n % c) continue; // solo cuadrículas completas (24 = 6x4, 4x6, 8x3...)
    const r = n / c, w = Math.min((W - gap*(c-1)) / c, ((H - gap*(r-1)) / r) * .75);
    if(w > cw){ cw = w; cols = c; }
  }
  cw = Math.floor(cw);
  board.style.gridTemplateColumns = `repeat(${cols}, ${cw}px)`;
  board.style.gap = gap + 'px';
  board.style.setProperty('--cw', cw + 'px');
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { buildBulbs(); layout(); }, 120); });

// =====================================================================
//  ESTADO
// =====================================================================
let player = '', first = null, lock = false, pairs = 0, timeLeft = 0, timer = null, idle = null, nameIdle = null, playing = false;
const ranking = []; // solo en memoria: se borra al cerrar o recargar la app

// ----- 1. INICIO (modo atracción) -----
function buildDemo(){
  const demo = $('demo'); demo.innerHTML = '';
  KEYS.slice(0, 6).forEach(k => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = cardHTML(k); demo.appendChild(c); });
}
setInterval(() => {
  if(!$('sStart').classList.contains('active')) return;
  const cards = $('demo').children; if(!cards.length) return;
  const c = cards[Math.floor(Math.random() * cards.length)];
  c.classList.add('flip'); setTimeout(() => c.classList.remove('flip'), 1300);
}, 650);
function renderMiniRank(){
  $('miniRank').innerHTML = ranking.length
    ? '👑 Récord del día: <b>' + esc(ranking[0].name) + '</b> — ' + ranking[0].score + ' pts'
    : '';
}
function goStart(){ clearTimeout(idle); clearTimeout(nameIdle); clearInterval(timer); playing = false; renderMiniRank(); show('sStart'); }

$('bPlay').onclick = () => {
  audio(); sfx.start();
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){}
  player = ''; renderName(); show('sName'); armNameIdle();
};

// ----- 2. NOMBRE con teclado en pantalla -----
const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKLÑ', 'ZXCVBNM'];
function buildKB(){
  const kb = $('kb'); kb.innerHTML = '';
  KB_ROWS.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'row';
    [...r].forEach(ch => row.appendChild(mkKey(ch, '', () => typeChar(ch))));
    if(i === 2) row.appendChild(mkKey('⌫', 'mid', backspace));
    kb.appendChild(row);
  });
  const last = document.createElement('div'); last.className = 'row';
  last.appendChild(mkKey('ESPACIO', 'wide', () => typeChar(' ')));
  last.appendChild(mkKey('¡A JUGAR!', 'go', startGame));
  kb.appendChild(last);
}
function mkKey(label, cls, fn){
  const b = document.createElement('button'); b.className = 'key ' + cls; b.textContent = label;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); sfx.key(); fn(); armNameIdle(); });
  return b;
}
function typeChar(ch){ if(player.length >= CONFIG.maxNombre) return; if(ch === ' ' && (!player || player.endsWith(' '))) return; player += ch; renderName(); }
function backspace(){ player = player.slice(0, -1); renderName(); }
function renderName(){
  $('nameBox').innerHTML = player ? esc(player) + '<span class="caret"></span>' : '<span class="caret"></span><span class="ph">TU NOMBRE</span>';
}
function armNameIdle(){ clearTimeout(nameIdle); nameIdle = setTimeout(() => { if($('sName').classList.contains('active')) goStart(); }, CONFIG.inactividadNombreSeg * 1000); }
// Teclado físico (por si se prueba en computadora)
document.addEventListener('keydown', e => {
  if(!$('sName').classList.contains('active')) return;
  if(e.key === 'Enter') startGame();
  else if(e.key === 'Backspace') backspace();
  else if(/^[a-zA-ZñÑáéíóúÁÉÍÓÚ ]$/.test(e.key)) typeChar(e.key.toUpperCase());
  armNameIdle();
});

// ----- 3. JUEGO -----
function startGame(){
  clearTimeout(nameIdle); audio();
  player = player.trim() || 'VIKINGO';
  first = null; lock = false; pairs = 0; timeLeft = CONFIG.tiempo; playing = true;
  $('pairs').textContent = 0; $('time').textContent = timeLeft; $('pName').textContent = player;
  $('time').parentElement.classList.remove('hot'); $('bar').classList.remove('hot');
  const fill = $('barFill'); fill.style.transition = 'none'; fill.style.transform = 'scaleX(1)'; void fill.offsetWidth; fill.style.transition = '';
  const board = $('board'); board.innerHTML = '';
  shuffle([...KEYS, ...KEYS]).forEach(k => {
    const c = document.createElement('div'); c.className = 'card'; c.dataset.k = k; c.innerHTML = cardHTML(k);
    c.addEventListener('pointerdown', e => { e.preventDefault(); pick(c); });
    board.appendChild(c);
  });
  show('sGame'); sfx.start(); toast('¡YA!');
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--; $('time').textContent = timeLeft;
    $('barFill').style.transform = `scaleX(${timeLeft / CONFIG.tiempo})`;
    if(timeLeft <= Math.min(10, Math.ceil(CONFIG.tiempo / 4))){ $('time').parentElement.classList.add('hot'); $('bar').classList.add('hot'); sfx.tick(); }
    if(timeLeft <= 0) endGame(false);
  }, 1000);
}

function pick(c){
  if(!playing || lock || c.classList.contains('flip')) return;
  c.classList.add('flip'); sfx.flip();
  if(!first){ first = c; return; }
  lock = true; const a = first; first = null;
  if(a.dataset.k === c.dataset.k){
    setTimeout(() => {
      a.classList.add('ok'); c.classList.add('ok'); sfx.ok(); sparks(a); sparks(c);
      pairs++; $('pairs').textContent = pairs; lock = false;
      if(pairs === KEYS.length) endGame(true);
      else if(pairs === Math.floor(KEYS.length/2)) toast('¡VAS BIEN!');
    }, 420);
  } else {
    setTimeout(() => { a.classList.add('bad'); c.classList.add('bad'); sfx.bad(); }, 550);
    setTimeout(() => { a.classList.remove('flip','bad'); c.classList.remove('flip','bad'); lock = false; }, 950);
  }
}

$('bExit').addEventListener('pointerdown', e => { e.preventDefault(); goStart(); });

// ----- 4. RESULTADOS -----
function endGame(win){
  if(!playing) return;
  playing = false; clearInterval(timer); lock = true;
  const score = pairs * CONFIG.puntosPorPar + (win ? timeLeft * CONFIG.puntosPorSegundo : 0);
  const entry = { name: player, score, t: Date.now() };
  ranking.push(entry);
  ranking.sort((a, b) => b.score - a.score || a.t - b.t);
  const pos = ranking.indexOf(entry);
  setTimeout(() => {
    $('msg').innerHTML = win
      ? `¡VICTORIA, ${esc(player)}! 🏆`
      : `¡SE ACABÓ EL TIEMPO!<br><span style="font-size:.55em;color:#fff">${esc(player)}, encontraste ${pairs} de ${KEYS.length} pares</span>`;
    const list = ranking.slice(0, CONFIG.topTabla);
    let rows = list.map((r, i) => `<tr class="${r === entry ? 'me' : ''}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join('');
    if(pos >= CONFIG.topTabla) rows += `<tr class="me"><td>${pos+1}</td><td>${esc(entry.name)}</td><td>${entry.score}</td></tr>`;
    $('rank').innerHTML = rows;
    show('sEnd'); slotCounter(score);
    if(win){ sfx.win(); flash(); rain(); document.body.classList.add('fast'); setTimeout(() => document.body.classList.remove('fast'), 4000); }
    else sfx.lose();
    clearTimeout(idle); idle = setTimeout(goStart, CONFIG.regresarInicioSeg * 1000);
  }, win ? 900 : 500);
}
$('bAgain').onclick = () => { audio(); sfx.key(); goStart(); };

// =====================================================================
//  ANIMACIONES
// =====================================================================
function sparks(el){
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i = 0; i < 18; i++){
    const s = document.createElement('div'), ang = Math.random()*Math.PI*2, dist = r.width*.5 + Math.random()*r.width*.9;
    s.className = 'spark'; s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--x', Math.cos(ang)*dist + 'px'); s.style.setProperty('--y', Math.sin(ang)*dist + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 850);
  }
}
function rain(){
  const colors = ['#e31e24','#ffffff','#111111','#ff5a60','#ffffff','#b3131a'];
  for(let i = 0; i < 110; i++){
    const d = document.createElement('div');
    if(i % 3 === 0){ d.className = 'drop coin'; }
    else { d.className = 'drop conf'; d.style.background = colors[i % colors.length]; }
    d.style.left = Math.random()*100 + 'vw';
    d.style.setProperty('--r', (Math.random()*1080 - 540) + 'deg');
    d.style.animationDuration = 2.2 + Math.random()*2.6 + 's';
    d.style.animationDelay = Math.random()*1.8 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 7000);
  }
}
function flash(){ const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1050); }
function slotCounter(target){
  const slot = $('slot'), digits = String(target).padStart(3, '0').length;
  slot.innerHTML = Array.from({length: digits}, () => '<div class="d">0</div>').join('') + '<div class="lbl">PTS</div>';
  const ds = slot.querySelectorAll('.d'), final = String(target).padStart(digits, '0');
  // Cada dígito gira como rodillo de tragamonedas y se detiene de izquierda a derecha
  ds.forEach((d, i) => {
    const stopAt = 700 + i * 450;
    const spin = setInterval(() => { d.textContent = Math.floor(Math.random()*10); sfx.coin(); }, 60);
    setTimeout(() => { clearInterval(spin); d.textContent = final[i]; tone(880 + i*220, .12, 'square', 0, .1); }, stopAt);
  });
}

// =====================================================================
//  ARRANQUE
// =====================================================================
buildDemo();
buildKB(); renderName(); buildBulbs(); renderMiniRank();
$('total').textContent = KEYS.length;
$('subtitle').textContent = `Encuentra los ${KEYS.length} pares antes de que se acabe el tiempo`;

// PWA: solo funciona servido por http(s), no con doble clic al archivo
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
